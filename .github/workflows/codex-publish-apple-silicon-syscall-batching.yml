name: Codex publish Apple Silicon syscall batching

on:
  push:
    branches:
      - perf/apple-silicon-syscall-batching-stage

permissions:
  contents: write

concurrency:
  group: codex-apple-silicon-syscall-batching
  cancel-in-progress: false

jobs:
  build-benchmark-publish:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      BASE_SHA: 0c8a418b0d003edced92d11bb54893c7a639f417
      OUTPUT_BRANCH: perf/apple-silicon-syscall-batching

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and preserve deterministic payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/codex/syscall_batching/patch_unixlib.py \
            .github/codex/syscall_batching/check_apple_silicon_hotpaths.py
          python3 .github/codex/syscall_batching/patch_unixlib.py
          python3 .github/codex/syscall_batching/check_apple_silicon_hotpaths.py \
            dlls/xtajit64/unixlib.c

          cp dlls/xtajit64/unixlib.c "$RUNNER_TEMP/unixlib.c"
          cp .github/codex/syscall_batching/check_apple_silicon_hotpaths.py \
            "$RUNNER_TEMP/check_apple_silicon_hotpaths.py"
          cp .github/codex/syscall_batching/apple_silicon_hotpaths.c \
            "$RUNNER_TEMP/apple_silicon_hotpaths.c"

      - name: Build two reviewable commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$BASE_SHA"

          install -m 644 "$RUNNER_TEMP/unixlib.c" dlls/xtajit64/unixlib.c
          python3 "$RUNNER_TEMP/check_apple_silicon_hotpaths.py" \
            dlls/xtajit64/unixlib.c
          bash -n dlls/xtajit64/provider_tests/run_unixlib_concurrency.sh
          git diff --check
          git add dlls/xtajit64/unixlib.c
          git commit -m "xtajit64: batch x64 syscall continuation registers"

          install -m 755 "$RUNNER_TEMP/check_apple_silicon_hotpaths.py" \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py
          install -m 644 "$RUNNER_TEMP/apple_silicon_hotpaths.c" \
            dlls/xtajit64/provider_tests/apple_silicon_hotpaths.c
          python3 dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py \
            dlls/xtajit64/unixlib.c
          python3 -m py_compile \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py
          bash -n dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh
          git diff --check
          git add \
            dlls/xtajit64/provider_tests/apple_silicon_hotpaths.c \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py
          git commit -m "test: benchmark x64 syscall continuation batching"

          git log --oneline --decorate -2
          git diff --check "$BASE_SHA..HEAD"

      - name: Benchmark native arm64 and publish branch
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh \
            "$RUNNER_TEMP/xtajit64-hotpaths" | tee "$RUNNER_TEMP/hotpaths.log"
          grep -E '^APPLE_SILICON_HOTPATH syscall_' "$RUNNER_TEMP/hotpaths.log"
          grep -F 'APPLE_SILICON_HOTPATH api_calls_per_syscall=6->2 removed=4' \
            "$RUNNER_TEMP/hotpaths.log"
          {
            echo "## Apple Silicon x64 syscall continuation benchmark"
            echo
            echo '```text'
            grep -E '^(APPLE_SILICON_CPU|APPLE_SILICON_HOTPATH)' \
              "$RUNNER_TEMP/hotpaths.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
