name: Source integrity

on:
  push:
    branches: [main]
    tags: ["source-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 256
      - name: Deepen source history through upstream base
        shell: bash
        run: |
          upstream_base="$(tr -d '[:space:]' < switchyard/upstream-base.txt)"
          while ! git merge-base --is-ancestor "$upstream_base" HEAD 2>/dev/null; do
            if [ "$(git rev-parse --is-shallow-repository)" != "true" ]; then
              echo "source history does not contain upstream base $upstream_base" >&2
              exit 1
            fi
            git fetch --no-tags --deepen=256 origin "$GITHUB_REF"
          done
      - name: Verify downstream history and source policy
        run: ./switchyard/verify_source.sh
      - name: Check runtime tooling syntax
        run: bash -n switchyard/build_runtime.sh switchyard/release_runtime.sh switchyard/verify_tls_packages.sh switchyard/lib/gpu_capability_policy.sh switchyard/lib/directory_safety.sh switchyard/lib/source_state.sh switchyard/tests/amd_umd_loader_policy_test.sh switchyard/tests/assertion_logging_test.sh switchyard/tests/atiadl_provider_policy_test.sh switchyard/tests/gpu_capability_policy_test.sh switchyard/tests/graphics_adapter_identity_test.sh switchyard/tests/directory_safety_test.sh switchyard/tests/source_state_test.sh switchyard/tests/runtime_tls_smoke_test.sh switchyard/tests/wow64_large_address_aware_test.sh
      - name: Verify runtime source-state guard
        run: ./switchyard/tests/source_state_test.sh
