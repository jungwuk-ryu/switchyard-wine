name: Codex publish Apple Silicon block poll

on:
  push:
    branches:
      - perf/apple-silicon-block-poll-stage

permissions:
  contents: write

concurrency:
  group: codex-apple-silicon-block-poll
  cancel-in-progress: false

jobs:
  build-benchmark-publish:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BASE_SHA: 06876a6ba30bd3b342d0ce0fe305232a368ecd35
      OUTPUT_BRANCH: perf/apple-silicon-block-poll

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and preserve deterministic payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/codex/block_poll/patch_block_poll.py
          install -m 644 .github/codex/block_poll/apple_silicon_block_poll.c \
            dlls/xtajit64/provider_tests/apple_silicon_block_poll.c
          python3 .github/codex/block_poll/patch_block_poll.py
          python3 dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py \
            dlls/xtajit64/unixlib.c
          bash -n dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh
          bash -n dlls/xtajit64/provider_tests/run_unixlib_concurrency.sh
          git diff --check

          cp dlls/xtajit64/unixlib.c "$RUNNER_TEMP/unixlib.c"
          cp dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py \
            "$RUNNER_TEMP/check_apple_silicon_hotpaths.py"
          cp dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh \
            "$RUNNER_TEMP/run_apple_silicon_hotpaths.sh"
          cp dlls/xtajit64/provider_tests/apple_silicon_block_poll.c \
            "$RUNNER_TEMP/apple_silicon_block_poll.c"

      - name: Build two reviewable commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$BASE_SHA"

          install -m 644 "$RUNNER_TEMP/unixlib.c" dlls/xtajit64/unixlib.c
          git diff --check
          git add dlls/xtajit64/unixlib.c
          git commit -m "xtajit64: streamline translated-block stop polling"

          install -m 755 "$RUNNER_TEMP/check_apple_silicon_hotpaths.py" \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py
          install -m 755 "$RUNNER_TEMP/run_apple_silicon_hotpaths.sh" \
            dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh
          install -m 644 "$RUNNER_TEMP/apple_silicon_block_poll.c" \
            dlls/xtajit64/provider_tests/apple_silicon_block_poll.c
          python3 dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py \
            dlls/xtajit64/unixlib.c
          python3 -m py_compile \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py
          bash -n dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh
          bash -n dlls/xtajit64/provider_tests/run_unixlib_concurrency.sh
          git diff --check
          git add \
            dlls/xtajit64/provider_tests/apple_silicon_block_poll.c \
            dlls/xtajit64/provider_tests/check_apple_silicon_hotpaths.py \
            dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh
          git commit -m "test: benchmark translated-block stop polling"

          git log --oneline --decorate -2
          git diff --check "$BASE_SHA..HEAD"

      - name: Benchmark native arm64 and publish branch
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dlls/xtajit64/provider_tests/run_apple_silicon_hotpaths.sh \
            "$RUNNER_TEMP/xtajit64-hotpaths" | tee "$RUNNER_TEMP/hotpaths.log"
          grep -E '^APPLE_SILICON_HOTPATH block_poll_' "$RUNNER_TEMP/hotpaths.log"
          grep -F 'APPLE_SILICON_HOTPATH block_poll_nullable_checks=1->0 pause_order=acquire->relaxed common_path=fallthrough' \
            "$RUNNER_TEMP/hotpaths.log"
          {
            echo "## Apple Silicon translated-block poll benchmark"
            echo
            echo '```text'
            grep -E '^(APPLE_SILICON_CPU|APPLE_SILICON_HOTPATH)' \
              "$RUNNER_TEMP/hotpaths.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
